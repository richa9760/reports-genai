name: Reports CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reports_test
          POSTGRES_USER: reports_user
          POSTGRES_PASSWORD: reports_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reports_user -d reports_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      POSTGRES_DB: reports_test
      POSTGRES_USER: reports_user
      POSTGRES_PASSWORD: reports_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

      DJANGO_SETTINGS_MODULE: config.settings

      LLM_PROVIDER: test
      LLM_MODEL: test-model
      LLM_BASE_URL: http://127.0.0.1:9999
      LLM_API_KEY: test-key

      LLM_FALLBACK_PROVIDER: test-fallback
      LLM_FALLBACK_MODEL: ""
      LLM_FALLBACK_BASE_URL: ""
      LLM_FALLBACK_API_KEY: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: |
          python manage.py check

      - name: Run LLMOps tests
        run: |
          python manage.py test reports.tests_llm --noinput

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/richa9760/reports-backend:latest
            ghcr.io/richa9760/reports-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/richa9760/reports-frontend:latest
            ghcr.io/richa9760/reports-frontend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/reports/reports-genai

            git pull origin main

            export BACKEND_IMAGE=ghcr.io/richa9760/reports-backend:${{ github.sha }}
            export FRONTEND_IMAGE=ghcr.io/richa9760/reports-frontend:${{ github.sha }}

            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              run --rm backend python manage.py migrate --noinput

            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              up -d

            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              ps