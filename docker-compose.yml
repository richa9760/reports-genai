services:
  postgres:
    image: postgres:16
    container_name: reports-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reports_db
      POSTGRES_USER: reports_user
      POSTGRES_PASSWORD: reports_password
    ports:
      - "5432:5432"
    volumes:
      - reports_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: reports-redis
    restart: unless-stopped
    ports:
      - "6379:6379"


volumes:
  reports_postgres_data:
